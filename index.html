<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graut kåringen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Bungee&family=Bungee+Inline&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#121212;--line:#2a2a2a;--text:#f5f1e8;--muted:#b3ada2;--accent:#ffcf3f;--accent2:#ff5d8f;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{max-width:640px;margin:0 auto}
body.host main{max-width:1100px}
h1{font-size:1.6rem;margin:.2em 0}
h2{font-size:1.15rem;margin:1.2em 0 .5em}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:12px;margin:4px 0 10px}
button{background:var(--accent);color:#1a1400;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;min-height:44px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#222;font-size:.8rem;color:var(--muted)}
.err{color:var(--accent2);font-size:.9rem;min-height:1.2em}
.code{font-size:3rem;font-weight:900;letter-spacing:.2em;color:var(--accent)}
.die{width:52px;height:52px;padding:0;background:#f4f1ea;border-radius:10px;border:3px solid transparent;display:inline-grid;place-items:center;transition:transform .12s;flex:none}
.die svg{width:80%;height:80%}
.die.six{background:#fff3c4}
.die.sel{border-color:var(--accent);transform:scale(1.12);box-shadow:0 0 0 3px #ffcf3f55}
.die:disabled{opacity:.25}
.dice{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.die.big{width:84px;height:84px;border-radius:16px}
.die.small{width:30px;height:30px;border-radius:7px;border-width:0}
.die.hidden{background:#333}
.roll{animation:roll .9s cubic-bezier(.2,.8,.3,1.2) both}
@keyframes roll{0%{transform:rotate(-540deg) scale(.2);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:pop .6s ease-out both}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:none;opacity:1}}
.voters{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin:16px 0}
.voter{text-align:center}
.voter .n{margin-top:6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avg{font-size:3.2rem;font-weight:900;color:var(--accent);text-align:center}
.pitch{text-align:center;padding:28px 14px}
.pitch .t{font-size:clamp(1.8rem,6vw,3.4rem);font-weight:900;line-height:1.1;margin:.3em 0}
.pitch .by{font-size:clamp(1.2rem,3.5vw,2rem);color:var(--accent);font-weight:800}
.pitch .cta{font-size:clamp(1.1rem,3vw,1.6rem);margin:1em 0}
#ytwrap{aspect-ratio:16/9;width:100%;background:#000;border-radius:var(--r);overflow:hidden;margin:10px 0}
#ytwrap[hidden]{display:none}
#ytwrap iframe{width:100%;height:100%;border:0}
.rank{font-size:1.4rem;font-weight:800;color:var(--accent);min-width:2ch}
.song{display:flex;justify-content:space-between;gap:10px;align-items:center}
.song b{display:block}
.bar{height:6px;background:#222;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
#qr:empty{display:none}
#qr{background:#fff;padding:10px;border-radius:10px;display:inline-block}
#qr img,#qr canvas{display:block;width:min(280px,70vw);height:min(280px,70vw)}
.center{text-align:center}
.split{display:grid;gap:16px}
@media(min-width:900px){body.host .split{grid-template-columns:2fr 1fr}}

/* ===== Las Vegas ===== */
:root{--pink:#ff2bd6;--cyan:#22f3ff;--gold:#ffcf3f;--red:#ff2340;--display:'Monoton','Bungee',system-ui,sans-serif;--sign:'Bungee',system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -10%,#2a0030 0%,#000 60%) fixed,#000;overflow-x:hidden}
main{position:relative;z-index:2}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,7vw,3.4rem);letter-spacing:.04em;color:#ffe6fb;line-height:1.15;
  text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 28px var(--pink),0 0 56px var(--pink);animation:flicker 6s infinite}
h2{font-family:var(--sign);font-weight:400;letter-spacing:.03em;color:var(--cyan);text-shadow:0 0 8px #22f3ff99}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.45}}
.card{background:rgba(14,4,20,.82);border:1px solid #ff2bd655;box-shadow:0 0 0 1px #ff2bd622,0 0 22px #ff2bd633,inset 0 0 18px #ff2bd614;backdrop-filter:blur(2px)}
button{font-family:var(--sign);font-weight:400;letter-spacing:.04em;background:var(--gold);color:#1a0d00;box-shadow:0 0 14px #ffcf3f88,0 0 2px #fff inset;transition:transform .12s,box-shadow .2s}
button:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 0 26px #ffcf3fcc}
button.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan);box-shadow:0 0 10px #22f3ff55,inset 0 0 8px #22f3ff22}
button.yt-btn{background:var(--red);color:#fff;box-shadow:0 0 18px #ff2340aa}
.die.big,.die{font-family:inherit}
.pill{background:#1c0a24;border:1px solid #ff2bd655;color:#ffd6f6}
.rank{font-family:var(--sign);font-weight:400;color:var(--gold);text-shadow:0 0 10px #ffcf3faa}
.avg{font-family:var(--display);font-weight:400;color:var(--gold);text-shadow:0 0 8px #fff,0 0 22px var(--gold),0 0 46px #ff9900}
.pitch .t{font-family:var(--sign);font-weight:400;text-shadow:0 0 18px #ff2bd6aa}
.pitch .by{font-family:var(--display);font-weight:400;color:var(--cyan);text-shadow:0 0 12px var(--cyan),0 0 30px var(--cyan)}
.bar i{background:linear-gradient(90deg,var(--pink),var(--gold));box-shadow:0 0 10px var(--pink)}
.code{font-family:var(--sign)}
/* Lyspærer rundt de store skiltene */
.marquee{border:7px dotted var(--gold)!important;border-radius:22px;animation:bulbs .8s steps(1) infinite;box-shadow:0 0 30px #ffcf3f55,inset 0 0 30px #ff2bd622}
@keyframes bulbs{50%{border-color:#fff7d6}}
/* Flygende terninger */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky .fly{position:absolute;bottom:-90px;display:grid;place-items:center;background:#f4f1ea;border-radius:18%;opacity:.32;
  box-shadow:0 0 18px var(--glow);animation:fly var(--d) linear var(--delay) infinite}
#sky .fly svg{width:80%;height:80%}
@keyframes fly{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),calc(-100vh - 180px)) rotate(var(--rot))}}
/* Magedansere */
.dancer{position:fixed;bottom:0;z-index:1;pointer-events:none;width:clamp(70px,12vw,150px);filter:drop-shadow(0 0 10px var(--pink)) drop-shadow(0 0 26px #ff2bd655)}
.dancer.l{left:2px}.dancer.r{right:2px;transform:scaleX(-1)}
.dancer svg{display:block;width:100%;overflow:visible}
.dancer .body{animation:bob 1.2s ease-in-out infinite alternate;transform-origin:70px 214px}
.dancer.r .body{animation-delay:-.6s}
.dancer .hips{animation:shimmy .45s ease-in-out infinite alternate;transform-origin:70px 96px}
.dancer .veil{fill:#ff2bd640;stroke:var(--pink);stroke-width:1.5;animation:veil 1.6s ease-in-out infinite alternate;transform-origin:70px 40px}
.dancer .skin,.dancer .skin-f{stroke:#e8b48a;fill:#c98e66}.dancer .skin-f{stroke-width:.8}
.dancer .hair{fill:#1a0a10;stroke:#3b1626;stroke-width:1}
.dancer .top{fill:var(--gold);stroke:#fff3c4;stroke-width:1}
.dancer .navel{fill:#7a4a30}
.dancer .skirt{fill:#ff2bd655;stroke:var(--pink);stroke-width:2}
.dancer .slit{stroke:var(--pink);stroke-width:1.5}
.dancer .belt{fill:var(--cyan);stroke:#bffcff;stroke-width:1}
.dancer .coins circle{fill:var(--gold);stroke:#fff3c4;stroke-width:.6;animation:jingle .22s linear infinite alternate}
@keyframes bob{0%{transform:translateY(0) rotate(-2deg)}100%{transform:translateY(-6px) rotate(2deg)}}
@keyframes shimmy{0%{transform:rotate(-7deg) translateX(-3px)}100%{transform:rotate(7deg) translateX(3px)}}
@keyframes veil{0%{transform:rotate(-6deg) scaleY(.92)}100%{transform:rotate(6deg) scaleY(1.06)}}
@keyframes jingle{to{transform:translateY(1.5px)}}
@media(max-width:700px){.dancer{opacity:.55}}
@media(prefers-reduced-motion:reduce){#sky{display:none}h1,.marquee,.dancer *{animation:none!important}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

  <div id="ytwrap" hidden><div id="ytplayer"></div></div>
  <div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== Oppsett: fyll inn for delt database (Supabase). Tomt = lokal testmodus (fungerer berre mellom faner i same nettlesar). =====
const SUPABASE_URL = 'https://utlpxrjniermyvvuzjwi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0bHB4cmpuaWVybXl2dnV6andpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MDY1NzQsImV4cCI6MjEwOTM4MjU3NH0.sA_HSIf9C240tj71d76jkG23nOmpC7yTavoPHMaPrDg'; // offentleg nøkkel, trygg å ha i nettlesaren

const MAX_SIX = 2, SONGS = 3;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]] } return a };
const newCode = () => Array.from({length:4}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');

// ===== Lokal adapter (testing utan server) =====
function localAdapter(){
  const K = 'mk.db.v2', bc = 'BroadcastChannel' in window ? new BroadcastChannel('mk') : null, subs = new Set();
  const read = () => { try { return JSON.parse(ls.get(K)) || {rooms:[],players:[],songs:[],votes:[]} } catch { return {rooms:[],players:[],songs:[],votes:[]} } };
  const write = d => { ls.set(K, JSON.stringify(d)); subs.forEach(f => f()); bc && bc.postMessage(1) };
  bc && (bc.onmessage = () => subs.forEach(f => f()));
  window.addEventListener('storage', e => e.key === K && subs.forEach(f => f()));
  return {
    async createRoom(r){ const d = read(); const room = {id:uid(), code:newCode(), phase:'lobby', idx:0, order:[], ...r}; d.rooms.push(room); write(d); return room },
    async loadState(code){ const d = read(); const room = d.rooms.find(r => r.code === code); if (!room) return null;
      return {room, players:d.players.filter(p => p.room_id === room.id), songs:d.songs.filter(s => s.room_id === room.id), votes:d.votes.filter(v => v.room_id === room.id)} },
    async join(room_id, name){ const d = read(); if (d.players.some(p => p.room_id === room_id && p.name.toLowerCase() === name.toLowerCase())) throw new Error('Det navnet er allerede med.');
      const p = {id:uid(), room_id, name}; d.players.push(p); write(d); return p },
    async addSongs(room_id, player_id, songs){ const d = read(); songs.forEach(s => d.songs.push({id:uid(), room_id, player_id, ...s})); write(d) },
    async updateRoom(id, patch){ const d = read(); Object.assign(d.rooms.find(r => r.id === id), patch); write(d) },
    async vote(room_id, player_id, song_id, score){ const d = read();
      const mine = d.votes.filter(v => v.player_id === player_id);
      if (score === 6 && mine.filter(v => v.score === 6 && v.song_id !== song_id).length >= MAX_SIX) throw new Error('Du har brukt begge seksene.');
      const v = mine.find(v => v.song_id === song_id); if (v) v.score = score; else d.votes.push({room_id, player_id, song_id, score}); write(d) },
    async listRooms(){ const d = read(); return d.rooms.slice().reverse().slice(0, 30).map(room => ({room, songs:d.songs.filter(s => s.room_id === room.id), votes:d.votes.filter(v => v.room_id === room.id)})) },
    subscribe(room_id, f){ subs.add(f); return () => subs.delete(f) }
  };
}

// ===== Supabase-adapter (delt mellom alle mobilar) =====
function supabaseAdapter(sb){
  const one = async q => { const {data, error} = await q; if (error) throw new Error(error.message); return data };
  return {
    async createRoom(r){ return one(sb.from('rooms').insert({code:newCode(), phase:'lobby', idx:0, order:[], ...r}).select().single()) },
    async listRooms(){ const rooms = await one(sb.from('rooms').select().order('created_at', {ascending:false}).limit(30)); if (!rooms.length) return [];
      const ids = rooms.map(r => r.id); const [songs, votes] = await Promise.all(['songs','votes'].map(t => one(sb.from(t).select().in('room_id', ids))));
      return rooms.map(room => ({room, songs:songs.filter(s => s.room_id === room.id), votes:votes.filter(v => v.room_id === room.id)})) },
    async loadState(code){ const room = await one(sb.from('rooms').select().eq('code', code).maybeSingle()); if (!room) return null;
      const [players, songs, votes] = await Promise.all(['players','songs','votes'].map(t => one(sb.from(t).select().eq('room_id', room.id))));
      return {room, players, songs, votes} },
    async join(room_id, name){ const {data, error} = await sb.from('players').insert({room_id, name}).select().single();
      if (error) throw new Error(error.code === '23505' ? 'Det navnet er allerede med.' : error.message); return data },
    async addSongs(room_id, player_id, songs){ await one(sb.from('songs').insert(songs.map(s => ({room_id, player_id, ...s})))) },
    async updateRoom(id, patch){ await one(sb.from('rooms').update(patch).eq('id', id)) },
    async vote(room_id, player_id, song_id, score){ const {error} = await sb.from('votes').upsert({room_id, player_id, song_id, score}, {onConflict:'player_id,song_id'});
      if (error) throw new Error(/seks/i.test(error.message) ? 'Du har brukt begge seksene.' : error.message) },
    subscribe(room_id, f){ const ch = sb.channel('room-' + room_id);
      ['rooms','players','songs','votes'].forEach(t => ch.on('postgres_changes', {event:'*', schema:'public', table:t, filter:(t === 'rooms' ? 'id' : 'room_id') + '=eq.' + room_id}, f));
      ch.subscribe(); const poll = setInterval(f, 5000); // reserve dersom sanntid fell ut
      return () => { sb.removeChannel(ch); clearInterval(poll) } }
  };
}

let api, st = null, unsub = null, route = {}, busy = false, again = false;

// ===== Hjelparar =====
function dieSvg(n){
  if (!n) return '';
  const P = {1:[[50,50]],2:[[28,28],[72,72]],3:[[28,28],[50,50],[72,72]],4:[[28,28],[72,28],[28,72],[72,72]],
    5:[[28,28],[72,28],[50,50],[28,72],[72,72]],6:[[28,25],[72,25],[28,50],[72,50],[28,75],[72,75]]}[n];
  return `<svg viewBox="0 0 100 100" aria-hidden="true">${P.map(([x,y]) => `<circle cx="${x}" cy="${y}" r="10" fill="${n===6?'#c2410c':'#1a1625'}"/>`).join('')}</svg>`;
}
const ytId = u => { const m = String(u).match(/(?:youtu\.be\/|[?&]v=|\/(?:embed|shorts|live)\/)([\w-]{11})/); return m ? m[1] : null };
const curSong = () => st && st.songs.find(s => s.id === st.room.order[st.room.idx]);
const owner = s => st.players.find(p => p.id === s.player_id);
const votesFor = s => st.votes.filter(v => v.song_id === s.id);
const eligible = s => st.players.filter(p => st.songs.some(x => x.player_id === p.id));
const sixesUsed = pid => st.votes.filter(v => v.player_id === pid && v.score === 6).length;
const avgOf = s => { const v = votesFor(s); return v.length ? v.reduce((a, b) => a + b.score, 0) / v.length : 0 };
const rankSongs = (songs, votes) => songs.map(s => { const v = votes.filter(x => x.song_id === s.id); return {s, avg:v.length ? v.reduce((a, b) => a + b.score, 0) / v.length : 0, six:v.filter(x => x.score === 6).length} })
  .sort((a, b) => b.avg - a.avg || b.six - a.six).map(x => x.s);
const playlistUrl = songs => 'https://www.youtube.com/watch_videos?video_ids=' + songs.slice(0, 50).map(s => s.yt).join(',');
const ranking = () => st.room.order.slice(0, st.room.phase === 'done' ? undefined : st.room.idx + (st.room.phase === 'reveal' ? 1 : 0))
  .map(id => st.songs.find(s => s.id === id)).filter(Boolean)
  .map(s => ({s, avg:avgOf(s), n:votesFor(s).length, six:votesFor(s).filter(v => v.score === 6).length}))
  .sort((a, b) => b.avg - a.avg || b.six - a.six);
const PITCH = ['Overbevis oss!', 'Hvorfor fortjener denne en sekser?', 'Selg den inn!', 'Hva er historien bak?', 'Gi oss ett godt argument!'];

// YouTube lager en midlertidig spilleliste av video-ID-ene. Den kan lagres i YouTube med kåringsnavnet.
function playlistBtn(songs, label = 'Åpne alle låtene som YouTube-spilleliste', red = false){
  if (!songs.length) return '';
  return `<a href="${playlistUrl(songs)}" target="_blank" rel="noopener" style="display:block;margin-top:10px"><button class="${red ? 'yt-btn' : 'ghost'}" style="width:100%">▶ ${label}</button></a>`;
}
function resultsHtml(){
  const r = ranking(); if (!r.length) return '';
  return r.map((x, i) => `<div class="card song"><span class="rank">${i+1}</span><div style="flex:1;min-width:0"><b>${esc(x.s.title)}</b><span class="muted">${esc(x.s.artist)} · ${x.s.year} · ${esc(owner(x.s)?.name)}</span>
    <div class="bar"><i style="width:${x.avg/6*100}%"></i></div></div><div style="text-align:right"><b>${x.avg.toFixed(2)}</b><div class="muted">${x.six}×6</div></div></div>`).join('');
}

// ===== Startside =====
function homeView(){
  const decades = [1950,1960,1970,1980,1990,2000,2010,2020];
  return `<h1>Graut kåringen</h1>
  <p class="muted">Hver deltaker legger inn ${SONGS} YouTube-videoer fra et valgt tiår. Før hver låt selger den som nominerte den, inn låten. Så spilles videoen én gang på storskjermen, og alle gir terningkast fra sin egen mobil med en gang. Maks ${MAX_SIX} seksere hver.</p>
  <div class="card marquee"><h2 style="margin-top:0">Ny kåring</h2>
    <p class="muted" style="margin-top:0">For den som styrer kåringen. Deltakerne blir med ved å skanne QR-koden på storskjermen.</p>
    <label>Navn på kåringen<input id="pn" placeholder="f.eks. Fredagskåring"></label>
    <label>Velg tiår<select id="pd">${decades.map(d => `<option value="${d}" ${d===1980?'selected':''}>${d}-tallet</option>`).join('')}</select></label>
    <div id="e" class="err"></div>
    <button onclick="createRoom()">Opprett kåring</button></div>
  <div id="saved"></div>
  ${SUPABASE_URL ? '' : '<p class="muted">Testmodus: uten database fungerer dette bare mellom faner i samme nettleser.</p>'}`;
}
const PHASE = {lobby:'Venter på deltakere', done:'Ferdig'};
async function loadSaved(){ const el = document.getElementById('saved'); if (!el) return;
  try { const list = (await api.listRooms()).filter(x => x.songs.length); if (!list.length || !document.getElementById('saved')) return;
    el.innerHTML = `<h2>Kåringer</h2>` + list.map(({room, songs, votes}) => { const done = room.phase === 'done';
      return `<div class="card"><div class="song"><div style="min-width:0"><b>${esc(room.name)}</b><span class="muted">${room.decade}-tallet · ${songs.length} låter · ${PHASE[room.phase] || 'Pågår'}</span></div>
        <button class="ghost" style="flex:none" onclick="go('vert/${room.code}')">Åpne</button></div>
        ${playlistBtn(done ? rankSongs(songs, votes) : songs, done ? 'Vinnerlisten på YouTube' : 'Alle låtene på YouTube', true)}</div>` }).join('');
  } catch (e) { console.error(e) } }
function myRooms(){ try { return JSON.parse(ls.get('mk.mine')) || [] } catch { return [] } }
async function createRoom(){
  try { const r = await api.createRoom({name:document.getElementById('pn').value.trim() || 'Graut kåringen', decade:+document.getElementById('pd').value});
    ls.set('mk.host.' + r.code, '1'); ls.set('mk.mine', JSON.stringify([{code:r.code, name:r.name}, ...myRooms()].slice(0, 10))); go('vert/' + r.code) } catch (e) { document.getElementById('e').textContent = e.message }
}

// ===== Storskjerm (vert) =====
let yt = null, ytReady = false, ytLoaded = null;
window.onYouTubeIframeAPIReady = () => { ytReady = true; lastKey = ''; render() };
function ensureYT(){ if (!document.getElementById('ytapi')) { const s = document.createElement('script'); s.id = 'ytapi'; s.src = 'https://www.youtube.com/iframe_api'; document.head.append(s) } }
function syncVideo(){
  const w = document.getElementById('ytwrap'), s = curSong(), show = st.room.phase === 'play' && s;
  w.hidden = !show;
  if (!show) { if (yt && yt.pauseVideo) yt.pauseVideo(); return }
  if (!ytReady || !window.YT) return ensureYT();
  if (!yt) { ytLoaded = s.yt; yt = new YT.Player('ytplayer', {videoId:s.yt, playerVars:{autoplay:1, playsinline:1, rel:0},
      events:{onReady:e => e.target.playVideo(), onStateChange:e => { if (e.data === 0 && st.room.phase === 'play') hostVote() }}}); return }
  if (ytLoaded !== s.yt) { ytLoaded = s.yt; yt.loadVideoById(s.yt) }
}
const hostPlay = () => { ensureYT(); return api.updateRoom(st.room.id, {phase:'play'}) };
const hostVote = () => api.updateRoom(st.room.id, {phase:'vote'});
const hostReveal = () => api.updateRoom(st.room.id, {phase:'reveal'});
const hostNext = () => st.room.idx + 1 >= st.room.order.length ? api.updateRoom(st.room.id, {phase:'done'}) : api.updateRoom(st.room.id, {phase:'pitch', idx:st.room.idx + 1});
function hostStart(){ ensureYT(); api.updateRoom(st.room.id, {phase:'pitch', idx:0, order:shuffle(st.songs.map(s => s.id))}) }

const inviteText = () => `Du er med i ${st.room.name}! Legg inn dine ${SONGS} YouTube-låter fra ${st.room.decade}-tallet her: ${location.href.split('#')[0]}#/spel/${st.room.code}`;
async function shareInvite(){ const t = inviteText();
  try { if (navigator.share) return await navigator.share({text:t}); await navigator.clipboard.writeText(t); alert('Invitasjonen er kopiert.') } catch {} }
function hostView(){
  const {room} = st, s = curSong(), link = location.href.split('#')[0] + '#/spel/' + room.code;
  const head = `<div class="row" style="justify-content:space-between"><div><h1>${esc(room.name)}</h1><span class="pill">${room.decade}–${room.decade+9}</span></div></div>`;
  if (room.phase === 'lobby') {
    const ready = st.players.filter(p => st.songs.some(x => x.player_id === p.id));
    return head + `<div class="split"><div class="card center"><h2 style="margin-top:0">Inviter deltakerne</h2><p class="muted">Skann QR-koden med mobilkameraet for å bli med.</p>
      <div id="qr"></div></div>
      <div class="card"><h2 style="margin-top:0">Deltakere (${ready.length} klare)</h2>${st.players.map(p => `<div class="song"><span>${esc(p.name)}</span><span class="pill">${st.songs.filter(x => x.player_id === p.id).length ? '✓ låter inne' : 'legger inn låter…'}</span></div>`).join('') || '<p class="muted">Venter på deltakere…</p>'}
      <button style="width:100%;margin-top:14px" ${ready.length < 2 ? 'disabled' : ''} onclick="hostStart()">▶ Start kåringen (${st.songs.length} låter)</button>${playlistBtn(st.songs)}</div></div>`;
  }
  if (room.phase === 'done') return head + `<h2>🏆 Endelig resultat</h2>` + playlistBtn(ranking().map(x => x.s), 'Vinnerlisten på YouTube', true) + resultsHtml();
  const n = `<span class="pill">Låt ${room.idx+1} av ${room.order.length}</span>`;
  const by = esc(owner(s)?.name);
  if (room.phase === 'pitch') return head + `<div class="card pitch pop marquee">${n}<p class="muted" style="margin-top:1.2em">Neste låt</p>
    <div class="t">${esc(s.title)}</div><div style="font-size:1.3rem">${esc(s.artist)} · ${s.year}</div>
    <p class="muted" style="margin-top:1.6em">Nominert av</p><div class="by">${by}</div>
    <div class="cta">🎤 ${by}, ${PITCH[room.idx % PITCH.length].replace(/^./, c => c.toLowerCase())}</div>
    <button onclick="hostPlay()">▶ Spill videoen</button></div>`;
  const info = `<div class="song"><div><b style="font-size:1.3rem">${esc(s.title)}</b><span class="muted">${esc(s.artist)} · ${s.year} · nominert av ${by}</span></div>${n}</div>`;
  const el = eligible(s), vs = votesFor(s);
  if (room.phase === 'play') return head + `<div class="card">${info}<button class="ghost" style="margin-top:10px" onclick="hostVote()">Hopp til terningkast</button></div>`;
  if (room.phase === 'vote') return head + `<div class="card">${info}<h2 class="center">🎲 Kast terningen! ${vs.length} / ${el.length}</h2>
    <div class="voters">${el.map(p => { const v = vs.find(v => v.player_id === p.id); return `<div class="voter"><span class="die big ${v ? '' : 'hidden'}" style="${v ? 'background:#3a3a3a' : ''}">${v ? '<span style="font-size:2rem">✓</span>' : ''}</span><div class="n">${esc(p.name)}</div></div>` }).join('')}</div>
    <button style="width:100%" onclick="hostReveal()">Vis terningene</button></div>`;
  if (room.phase === 'reveal') return head + `<div class="card">${info}
    <div class="voters">${el.map((p, i) => { const v = vs.find(v => v.player_id === p.id); return `<div class="voter"><span class="die big roll ${v?.score === 6 ? 'six' : ''} ${v ? '' : 'hidden'}" style="animation-delay:${i*.25}s">${dieSvg(v?.score)}</span><div class="n">${esc(p.name)}</div></div>` }).join('')}</div>
    <div class="avg roll" style="animation-delay:${el.length*.25+.3}s">${avgOf(s).toFixed(2)}</div>
    <button style="width:100%" onclick="hostNext()">${room.idx + 1 >= room.order.length ? '🏆 Vis resultatet' : 'Neste låt ▶'}</button></div>
    <h2>Stillingen så langt</h2>${resultsHtml()}`;
}
let autoFor = null;
function hostAuto(){ // vis terningane automatisk når alle har stemt
  if (st.room.phase !== 'vote') return; const s = curSong(), el = eligible(s), n = votesFor(s).filter(v => el.some(p => p.id === v.player_id)).length;
  if (el.length && n >= el.length && autoFor !== s.id) { autoFor = s.id; setTimeout(() => st.room.phase === 'vote' && curSong()?.id === s.id && hostReveal(), 1200) }
}

// ===== Mobil (deltakar) =====
const me = () => st.players.find(p => p.id === ls.get('mk.player.' + st.room.code));
async function playerJoin(){ const e = document.getElementById('e'), name = document.getElementById('nm').value.trim();
  if (!name) return e.textContent = 'Skriv navnet ditt.';
  try { const p = await api.join(st.room.id, name); ls.set('mk.player.' + st.room.code, p.id); lastKey = ''; refresh() } catch (x) { e.textContent = x.message } }
async function playerSongs(){ const e = document.getElementById('e'), d = st.room.decade, songs = [];
  for (let i = 0; i < SONGS; i++) { const g = k => document.getElementById(k + i).value.trim();
    const y = +g('y'), id = ytId(g('u'));
    if (!id) return e.textContent = `Låt ${i+1} trengerer en gyldig YouTube-lenke.`;
    if (!g('a') || !g('t')) return e.textContent = `Fyll inn artist og tittel på låt ${i+1}.`;
    if (!(y >= d && y <= d + 9)) return e.textContent = `Låt ${i+1} må være fra ${d}–${d+9}.`;
    songs.push({artist:g('a'), title:g('t'), year:y, yt:id}) }
  try { document.activeElement?.blur(); await api.addSongs(st.room.id, me().id, songs); ls.set(draftKey(), '{}'); lastKey = ''; refresh() } catch (x) { e.textContent = x.message } }
async function playerVote(score){ try { await api.vote(st.room.id, me().id, curSong().id, score); refresh() } catch (x) { alert(x.message) } }

function playerView(){
  const {room} = st, p = me(), head = `<h1>${esc(room.name)}</h1><span class="pill">${room.decade}–${room.decade+9}</span>`;
  if (!p) return room.phase !== 'lobby' ? head + `<p class="muted">Kåringen har startet, så det er for sent å bli med.</p>` :
    head + `<div class="card"><h2 style="margin-top:0">Logg inn</h2><label>Navnet ditt<input id="nm" placeholder="Navn" autocomplete="nickname"></label><div id="e" class="err"></div><button onclick="playerJoin()">Bli med</button></div>`;
  const mySongs = st.songs.filter(s => s.player_id === p.id), who = `<p class="muted">Logget inn som <b>${esc(p.name)}</b></p>`;
  if (room.phase === 'lobby') {
    if (mySongs.length) return head + who + `<div class="card"><h2 style="margin-top:0">✓ Låtene dine er inne</h2>${mySongs.map(s => `<div class="muted">${esc(s.artist)} – ${esc(s.title)} (${s.year})</div>`).join('')}</div><p class="center muted">Venter på at kåringen starter…</p>`;
    return head + who + `<div class="card"><h2 style="margin-top:0">Dine ${SONGS} låter</h2>
      ${[0,1,2].map(i => `<div class="muted">Låt ${i+1}</div><input id="u${i}" type="url" inputmode="url" placeholder="YouTube-lenke"><div class="row"><input id="a${i}" placeholder="Artist"><input id="t${i}" placeholder="Tittel"></div><input id="y${i}" type="number" inputmode="numeric" placeholder="År (${room.decade}–${room.decade+9})">`).join('')}
      <div id="e" class="err"></div><button onclick="playerSongs()">Send inn låtene</button></div>`;
  }
  if (room.phase === 'done') return head + who + `<h2>🏆 Endelig resultat</h2>` + playlistBtn(ranking().map(x => x.s), 'Vinnerlisten på YouTube', true) + resultsHtml();
  const s = curSong(), mine = s.player_id === p.id, v = st.votes.find(v => v.player_id === p.id && v.song_id === s.id), used = sixesUsed(p.id);
  const info = `<div class="card center"><span class="pill">Låt ${room.idx+1} av ${room.order.length}</span><h2>${esc(s.title)}</h2><div class="muted">${esc(s.artist)} · ${s.year}</div><div class="muted">Nominert av ${esc(owner(s)?.name)}</div></div>`;
  const sixes = `<div class="center"><span class="muted">Seksere igjen: </span>${[0,1].map(i => `<span class="die small six" style="opacity:${i < MAX_SIX - used ? 1 : .2}">${dieSvg(6)}</span>`).join(' ')}</div>`;
  if (room.phase === 'pitch') return head + who + info + (mine ? `<div class="card pitch pop"><div class="by">🎤 Din tur!</div><div class="cta">Selg inn låten din til de andre.</div></div>` : `<p class="center">🎤 ${esc(owner(s)?.name)} selger inn låten…</p>`) + sixes;
  if (room.phase === 'play') return head + who + info + `<p class="center">🎧 Lytt på storskjermen…</p>${mine ? '<p class="center muted">Dette er låten din.</p>' : ''}${sixes}`;
  if (room.phase === 'vote') return head + who + info + `<h2 class="center">Kast terningen!</h2>
    <div class="dice">${[1,2,3,4,5,6].map(n => { const sel = v?.score === n, block = n === 6 && !sel && used >= MAX_SIX;
      return `<button class="die big ${sel ? 'sel' : ''} ${n === 6 ? 'six' : ''}" ${block ? 'disabled' : ''} aria-label="Terningkast ${n}" onclick="playerVote(${n})">${dieSvg(n)}</button>` }).join('')}</div>
    ${v ? '<p class="center muted">Registrert. Du kan endre helt til terningene blir vist.</p>' : ''}${sixes}`;
  return head + who + info + `<div class="center"><span class="muted">Ditt kast</span><div class="dice"><span class="die big ${v?.score === 6 ? 'six' : ''} ${v ? '' : 'hidden'}">${dieSvg(v?.score)}</span></div>
    <span class="muted">Snitt</span><div class="avg">${avgOf(s).toFixed(2)}</div></div>`;
}

// ===== Ruting og oppdatering =====
function go(path){ location.hash = '#/' + path }
async function refresh(){
  if (busy) { again = true; return } busy = true;
  try { if (route.code) st = await api.loadState(route.code) } catch (e) { console.error(e) }
  busy = false; render(); if (again) { again = false; refresh() }
}
let lastKey = '';
// Kladd: det deltakeren skriver lagres fortløpende, så ingenting forsvinner ved feil eller ny innlasting
const draftKey = () => 'mk.draft.' + (st?.room?.code || '');
function restoreDraft(){ let d = {}; try { d = JSON.parse(ls.get(draftKey())) || {} } catch {}
  document.querySelectorAll('#app input[id]').forEach(i => { if (d[i.id] != null && !i.value) i.value = d[i.id] }) }
document.addEventListener('input', e => { const i = e.target; if (route.view === 'vert' || !st || !i.id || i.closest('#app') === null) return;
  let d = {}; try { d = JSON.parse(ls.get(draftKey())) || {} } catch {} d[i.id] = i.value; ls.set(draftKey(), JSON.stringify(d)) });
function render(){
  const el = document.getElementById('app'); document.body.classList.toggle('host', route.view === 'vert');
  if (!route.code) { document.getElementById('ytwrap').hidden = true; el.innerHTML = homeView(); loadSaved(); return }
  if (!st) { el.innerHTML = `<h1>Fant ikke rommet ${esc(route.code)}</h1><button onclick="go('')">Tilbake</button>`; return }
  const key = JSON.stringify([route.view, st.room.phase, st.room.idx, st.players.length, st.songs.length, st.votes]);
  if (key === lastKey) return;
  // Ikkje teikn skjemaet på nytt medan deltakaren skriv i det
  const typing = route.view !== 'vert' && st.room.phase === 'lobby' && el.contains(document.activeElement) && document.activeElement.tagName === 'INPUT';
  if (typing) return; lastKey = key;
  el.innerHTML = route.view === 'vert' ? hostView() : playerView();
  if (route.view !== 'vert') restoreDraft();
  if (route.view === 'vert') { syncVideo(); hostAuto();
    const q = document.getElementById('qr'); if (q && window.QRCode) new QRCode(q, {text:location.href.split('#')[0] + '#/spel/' + st.room.code, width:320, height:320}) }
}
function onRoute(){
  const [, view, code] = (location.hash.match(/^#\/(vert|spel)\/([A-Za-z]{4})/) || []);
  route = {view, code:code && code.toUpperCase()}; st = null; lastKey = ''; unsub && unsub(); unsub = null;
  if (!route.code) return render();
  refresh().then(() => { if (st) unsub = api.subscribe(st.room.id, refresh) });
}
const DANCER = `<svg viewBox="0 0 140 220" aria-hidden="true"><g class="body">
<path class="veil" d="M18 40 C40 -6 100 -6 122 40 C104 22 36 22 18 40Z"/>
<path class="skin" d="M50 60 L22 38 M90 60 L118 38" stroke-width="5" stroke-linecap="round" fill="none"/>
<circle class="skin-f" cx="70" cy="30" r="13"/>
<path class="hair" d="M57 28 C56 10 84 10 83 28 C88 40 90 60 84 70 C82 52 80 40 76 34 M57 28 C52 42 52 58 56 68"/>
<rect class="skin-f" x="66" y="42" width="8" height="8"/>
<path class="skin-f" d="M52 52 C60 48 80 48 88 52 L84 70 C80 80 79 88 82 96 L58 96 C61 88 60 80 56 70Z"/>
<path class="top" d="M52 56 C56 50 68 52 69 60 C69 66 56 68 52 62Z M88 56 C84 50 72 52 71 60 C71 66 84 68 88 62Z"/>
<circle class="navel" cx="70" cy="84" r="1.4"/>
<g class="hips"><path class="skirt" d="M56 96 L84 96 C100 140 112 180 120 214 L20 214 C28 180 40 140 56 96Z"/>
<path class="belt" d="M54 92 C62 98 78 98 86 92 L90 104 C78 110 62 110 50 104Z"/>
<g class="coins">${[52,58,64,70,76,82,88].map((x,i)=>`<circle cx="${x}" cy="${108+(i%2)*3}" r="2.6"/>`).join('')}</g>
<path class="slit" d="M70 112 L66 214"/></g></g></svg>`;
function launchDancers(){ document.querySelectorAll('.dancer').forEach(d => d.innerHTML = DANCER) }
function launchDice(){ const sky = document.getElementById('sky'); if (!sky) return; const glows = ['#ff2bd6','#22f3ff','#ffcf3f'];
  for (let i = 0; i < 12; i++) { const d = document.createElement('div'), size = 26 + Math.random() * 44; d.className = 'fly'; d.innerHTML = dieSvg(1 + Math.floor(Math.random() * 6));
    d.style.cssText = `left:${Math.random() * 100}%;width:${size}px;height:${size}px;--d:${9 + Math.random() * 10}s;--delay:${-Math.random() * 18}s;--dx:${(Math.random() - .5) * 60}vw;--rot:${(Math.random() < .5 ? -1 : 1) * (360 + Math.random() * 1080)}deg;--glow:${glows[i % 3]}`;
    sky.append(d) } }
async function boot(){ launchDice(); launchDancers();
  if (SUPABASE_URL) { await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload = ok; s.onerror = no; document.head.append(s) });
    api = supabaseAdapter(supabase.createClient(SUPABASE_URL, SUPABASE_KEY)) } else api = localAdapter();
  window.addEventListener('hashchange', onRoute); onRoute();
}
boot();
</script>
</body>
</html>
